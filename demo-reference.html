<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Asistente del Local</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: arriba, un selector de las tres caras del producto (Cliente · Local · Configurar).
   Abajo, un marco que cambia de forma: teléfono angosto para el chat, hoja ancha para panel y ficha. */
:root{
  --bg:#E7E4DE;
  --surface:#FFFFFF;
  --surface-2:#F3F0EA;
  --ink:#1B1915;
  --muted:#6E6860;
  --line:#E2DDD4;
  --brand:#A86D21;           /* lo pisa la ficha de cada local */
  --brand-ink:#FFFFFF;
  --brand-text:color-mix(in srgb,var(--brand) 86%,#000);
  --brand-soft:color-mix(in srgb,var(--brand) 13%,var(--surface));
  --ok:#2F7D51; --warn:#B4600F; --bad:#B23A32;
  --f-marca:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-texto:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0B0D; --surface:#17161A; --surface-2:#232128; --ink:#F2EFE9; --muted:#9C958A; --line:#2E2C33;
  --brand-text:color-mix(in srgb,var(--brand) 60%,#fff);
  --brand-soft:color-mix(in srgb,var(--brand) 20%,var(--surface));
  --ok:#67C98D; --warn:#E9A25A; --bad:#F07F76; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B0B0D; --surface:#17161A; --surface-2:#232128; --ink:#F2EFE9; --muted:#9C958A; --line:#2E2C33;
  --brand-text:color-mix(in srgb,var(--brand) 60%,#fff);
  --brand-soft:color-mix(in srgb,var(--brand) 20%,var(--surface));
  --ok:#67C98D; --warn:#E9A25A; --bad:#F07F76; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.5 var(--f-texto);-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  padding-block:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* selector de caras */
.caras{width:min(760px,100%);display:grid;gap:6px;flex:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:9px 6px;border-radius:10px;cursor:pointer;font-weight:600;font-size:.92rem;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink)}
.caras p{margin:0;text-align:center;font-size:.82rem;color:var(--muted)}

/* marco */
.marco{width:min(760px,100%);flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative;
  background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:0 26px 60px -32px rgba(0,0,0,.45)}
.marco.chat{width:min(420px,100%)}
.vista{flex:1;min-height:0;display:flex;flex-direction:column}
.vista[hidden]{display:none!important}

/* ---------- CHAT ---------- */
.tope{display:flex;align-items:center;gap:13px;padding:15px 16px;border-bottom:1px solid var(--line);flex:none}
.avatar{width:56px;height:56px;border-radius:16px;flex:none;display:grid;place-items:center;overflow:hidden;background:var(--brand);color:var(--brand-ink);font:700 1.5rem/1 var(--f-marca)}
.avatar img{width:100%;height:100%;object-fit:cover}
.quien{flex:1;min-width:0}
.nom{font:800 1.5rem/1.1 var(--f-marca);letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.estado{font-size:.82rem;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:3px}
.punto{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.cinta{font-size:.74rem;color:var(--brand-text);background:var(--brand-soft);text-align:center;padding:5px 12px;flex:none;border-bottom:1px solid var(--line)}
.sello{flex:none;text-align:center;padding:7px 12px;padding-bottom:max(7px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);font-size:.72rem;color:var(--muted);text-decoration:none;background:var(--surface)}
.sello b{font-family:var(--f-marca);color:var(--ink);font-weight:800}
.sello b i{color:var(--brand);font-style:normal}
.logoprev{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.logoprev img{width:54px;height:54px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}
.hilo{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px 14px 8px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere;animation:aparece .2s ease both}
.msg.bot{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:5px}
.msg.yo{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:5px}
@keyframes aparece{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.ficha{display:grid;gap:3px;margin-top:6px;padding-top:8px;border-top:1px solid color-mix(in srgb,currentColor 18%,transparent);font-size:.92rem;white-space:normal}
.ficha div{display:flex;gap:8px}.ficha span{opacity:.68;min-width:4.4rem}
.dots{display:inline-flex;gap:4px;padding:3px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);opacity:.4;animation:late 1.1s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes late{0%,60%,100%{opacity:.25;transform:none}30%{opacity:.9;transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.msg,.dots i{animation:none}}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 14px 10px;flex:none;max-height:40%;overflow-y:auto}
.chip{font-weight:500;font-size:.9rem;line-height:1;color:var(--brand-text);background:var(--surface);border:1.4px solid color-mix(in srgb,var(--brand) 45%,var(--line));
  padding:9px 14px;border-radius:999px;cursor:pointer}
.chip:hover{background:var(--brand-soft)}
.chip.lleno{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.propuesta{width:100%;background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 35%,var(--line));border-radius:14px;padding:12px 14px;display:grid;gap:10px}
.propuesta b{font-family:var(--f-marca)}
.propuesta .acc{display:flex;gap:8px;flex-wrap:wrap}
.barra{display:flex;gap:9px;align-items:flex-end;padding:11px 14px;padding-bottom:max(11px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);flex:none}
.barra textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--surface-2);font-size:1rem;line-height:1.4;padding:11px 14px;border-radius:18px;max-height:96px}
.enviar{width:46px;height:46px;flex:none;border:0;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-size:1.15rem;cursor:pointer}
.enviar:disabled{opacity:.4;cursor:default}
.oculto{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- PANEL Y FICHA (hoja ancha) ---------- */
.hoja{flex:1;min-height:0;overflow-y:auto;padding:18px 20px 28px;display:grid;align-content:start;gap:18px}
.cab{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.cab h2{margin:0;font:700 1.35rem/1.15 var(--f-marca);letter-spacing:-.01em;text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:.86rem}
.modo{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.modo .punto.no{background:var(--warn)}
.dias{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.dia{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 11px;cursor:pointer;display:grid;justify-items:center;gap:1px;min-width:58px}
.dia small{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.dia b{font:700 1.05rem/1.1 var(--f-marca)}
.dia .n{font-size:.68rem;color:var(--brand-text);min-height:1em}
.dia[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.dia.alerta{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.cifras{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cifra{background:var(--surface-2);border-radius:12px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.cifra small{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cifra b{font:700 1.25rem/1.1 var(--f-marca);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
@media (max-width:560px){.cifras{grid-template-columns:repeat(2,1fr)}}
.medios{font-size:.8rem;color:var(--muted);margin-top:-8px}
.lista{display:grid;gap:8px}
.vacio{border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);font-size:.92rem}
.turno{border:1px solid var(--line);border-radius:14px;padding:11px 13px;display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center}
.turno .hora{font:700 1.1rem/1 var(--f-marca);font-variant-numeric:tabular-nums}
.turno .info{min-width:0}
.turno .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.turno .info span{font-size:.84rem;color:var(--muted)}
.turno .acc{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;padding-top:6px}
.turno.apagado{opacity:.55}
.pill{font-size:.72rem;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.pendiente{background:var(--brand-soft);color:var(--brand-text)}
.pill.atendido{background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:var(--ok)}
.pill.sin{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}
.pill.no_vino,.pill.cancelado{color:var(--muted)}
.pill.warn{background:color-mix(in srgb,var(--warn) 16%,var(--surface));color:var(--warn)}
.turno .marcas{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.origen{font-size:.7rem;color:var(--muted);margin-left:6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;cursor:pointer;font-size:.86rem;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ok{border-color:color-mix(in srgb,var(--ok) 50%,var(--line));color:var(--ok)}
.btn.peligro{color:var(--bad)}
a.btn{text-decoration:none;display:inline-block}
.caja{border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:12px;background:var(--surface-2)}
.caja h3,.bloque h3{margin:0;font:700 1rem/1.2 var(--f-marca)}
.campos{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
label.c{display:grid;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
label.c input,label.c select,label.c textarea,.fila input,.fila select,.buscar input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;font-size:.95rem;color:var(--ink);min-width:0;width:100%}
.check{display:flex;align-items:center;gap:8px;font-size:.92rem}
.acciones{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nota{font-size:.84rem;color:var(--muted)}
.nota.ok{color:var(--ok)}.nota.mal{color:var(--bad)}

.bloque{display:grid;gap:10px;padding-top:16px;border-top:1px solid var(--line)}
.bloque:first-of-type{border-top:0;padding-top:0}
.bloque p.sub{margin-top:-4px}
.fila{display:grid;gap:8px;align-items:center}
.fila.srv{grid-template-columns:minmax(0,1fr) 7rem 6rem 2.4rem}
.fila.faq{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) 2.4rem}
.fila.rec{grid-template-columns:minmax(0,1fr) 2.4rem}
.fila.hor{grid-template-columns:7.5rem 1fr 1fr}
.fila.srv .alias{grid-column:1/-1;font-size:.86rem;background:var(--surface-2)}
.fila.srv+.fila.srv{padding-top:6px;border-top:1px dashed var(--line)}
.fila.hor input[type=checkbox]{width:auto}
.encab{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.quitar{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:2.4rem;cursor:pointer;color:var(--muted)}
@media (max-width:560px){
  .fila.srv{grid-template-columns:minmax(0,1fr) 5.6rem 2.4rem}
  .fila.srv .dur{grid-column:1/2}
  .fila.faq{grid-template-columns:minmax(0,1fr) 2.4rem}
  .fila.faq .r{grid-column:1/2}
  .fila.hor{grid-template-columns:6.5rem 1fr 1fr}
  .encab.desk{display:none}
}
.rubros{display:flex;flex-wrap:wrap;gap:8px}
.rubro{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;cursor:pointer;font-size:.9rem}
.rubro[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-text);font-weight:600}
.pie-guardar{position:sticky;bottom:0;margin:0 -20px -28px;padding:12px 20px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
</style>

<div class="caras">
  <div class="seg" role="tablist" aria-label="Versiones del producto">
    <button role="tab" id="tab-cliente" aria-selected="true" data-cara="cliente">Cliente</button>
    <button role="tab" id="tab-local" aria-selected="false" data-cara="local">Local</button>
    <button role="tab" id="tab-configurar" aria-selected="false" data-cara="configurar">Configurar</button>
  </div>
  <p id="leyenda">Lo que ve quien escanea el QR: pregunta y saca turno solo.</p>
</div>

<div class="marco chat" id="marco">
  <!-- CLIENTE -->
  <section class="vista" id="v-cliente">
    <div class="tope">
      <div class="avatar" id="avatar">B</div>
      <div class="quien">
        <div class="nom" id="nomChat">…</div>
        <div class="estado"><span class="punto"></span><span id="estadoChat">Asistente · responde al instante</span></div>

    <form class="barra" id="barra">
      <label for="texto" class="oculto">Escribí tu mensaje</label>
      <textarea id="texto" rows="1" placeholder="Escribí tu consulta…" autocomplete="off"></textarea>
      <button class="enviar" id="enviar" type="submit" aria-label="Enviar" disabled>&#8593;</button>
    </form>
    <a class="sello" href="https://web-ia-ruddy.vercel.app/" target="_blank" rel="noopener" aria-label="Con tecnología WEBI">con tecnología <b>w<i>&rsquo;</i>ebi</b></a>
  </section>

  <!-- LOCAL -->
  <section class="vista" id="v-local" hidden>
    <div class="hoja" id="hojaLocal"></div>
  </section>

  <!-- CONFIGURAR -->
  <section class="vista" id="v-configurar" hidden>
    <div class="hoja" id="hojaConfig"></div>
  </section>
</div>

<script>

  return S.turnos.some(t=>t.id!==excluir && t.recursoId===recursoId && t.fecha===fecha && t.estado!=="cancelado" &&
    aMin(t.hora) < ini+dur && ini < aMin(t.hora)+(t.dur||30));

function libres(fecha,servicio,recursoId){
  const f=S.ficha, h=f.horarios[desdeIso(fecha).getDay()];
  if(!h||!servicio) return [];
  const ini=aMin(h.abre), fin=aMin(h.cierra), dur=Number(servicio.duracion)||30, paso=Number(f.intervalo)||30;
  const ahora=new Date(), esHoy=fecha===hoyIso(), yaMin=ahora.getHours()*60+ahora.getMinutes()+15;

    const r = recs.find(x=>!ocupado(x,fecha,m,dur));

/* --- el intérprete: entiende lo que escriben sin depender de nada externo --- */
const STOP=new Set("que como cual cuales donde cuando cuanto cuanta cuantos para por con los las del una uno unos unas tienen tiene tenes tengo hay hacen hacer puedo puede algo esta estan otro otra mas muy bien quiero queria quisiera necesito".split(" "));
const palabras=t=>norm(t).replace(/[^a-z0-9ñ ]+/g," ").split(/\s+/).filter(Boolean);
const sig=w=>(w.length>=3||/^\d+$/.test(w))&&!STOP.has(w);
function casi(a,b){ // distancia de edición <= 1 (para errores de tipeo)
  if(a===b) return true; const la=a.length, lb=b.length; if(Math.abs(la-lb)>1) return false;
  let i=0,j=0,ed=0; while(i<la&&j<lb){ if(a[i]===b[j]){i++;j++;continue;} if(++ed>1) return false; if(la>lb)i++; else if(lb>la)j++; else{i++;j++;} }
  return ed+(la-i)+(lb-j)<=1;
}
function igual(w,c){
  if(w===c) return true; if(/\d/.test(w)||/\d/.test(c)) return false;
  if(c.length>=5&&w.length>=4&&casi(w,c)) return true;
  const [s,l]=w.length<c.length?[w,c]:[c,w]; return s.length>=5&&l.startsWith(s);
}
/* cuántas palabras de "frase" aparecen todas en el mensaje (0 si falta alguna) */
function calza(toks,frase){ const fs=palabras(frase).filter(sig); if(!fs.length) return 0; return fs.every(x=>toks.some(w=>igual(w,x)))?fs.length:0; }
const DIA_NOM={domingo:0,lunes:1,martes:2,miercoles:3,jueves:4,viernes:5,sabado:6};
const NUM_PAL={una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12};

function entender(raw){
  const f=S.ficha, toks=palabras(raw), t=" "+toks.join(" ")+" ", e={info:null};
  const hay=(...ks)=>ks.some(k=>t.includes(k));
  // servicio: el nombre o cualquiera de sus "también le dicen"
  let mejor=0;
  f.servicios.forEach(s=>[s.nombre].concat(String(s.alias||"").split(",")).forEach(c=>{ if(!c.trim()) return; const n=calza(toks,c); if(n>mejor){mejor=n;e.servicioId=s.id;} }));
  // persona o lugar
  if(hay(" me da igual "," cualquiera "," quien sea "," el que haya "," la que haya "," el que este "," indistinto "," da igual ")) e.recursoId=null;
  else { let m=0; f.recursos.forEach(r=>{ const n=calza(toks,r.nombre); if(n>m){m=n;e.recursoId=r.id;} }); }
  // franja del día
  if(/ (a|por|de) la manana /.test(t)||hay(" temprano ")) e.franja=[0,13*60,"a la mañana"];
  else if(hay(" mediodia ")) e.franja=[11*60+30,15*60,"al mediodía"];
  else if(/ (a|por|de|esta) la tarde /.test(t)||hay(" esta tarde "," tardecita ")) e.franja=[13*60,20*60+30,"a la tarde"];
  else if(/ (a|por|de) la noche /.test(t)||hay(" esta noche ")) e.franja=[19*60,24*60,"a la noche"];
  // día
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const mas=n=>{const d=new Date(hoy);d.setDate(d.getDate()+n);return iso(d);};
  const sinFranja=t.replace(/ (a|por|de) la manana /g," ");
  let m;
  if(/ pasado manana /.test(sinFranja)) e.fecha=mas(2);
  else if(/ manana /.test(sinFranja)) e.fecha=mas(1);
  else if(/ hoy /.test(t)) e.fecha=mas(0);
  else if(m=norm(raw).match(/\b(\d{1,2})[\/-](\d{1,2})\b/)){ let d=new Date(hoy.getFullYear(),+m[2]-1,+m[1]); if(d<hoy) d.setFullYear(d.getFullYear()+1); e.fecha=iso(d); }
  else { for(const [n,i] of Object.entries(DIA_NOM)){ if(toks.some(w=>igual(w,n))){ let off=(i-hoy.getDay()+7)%7; if(off===0&&hay(" proximo "," que viene ")) off=7; e.fecha=mas(off); break; } } }
  if(!e.fecha&&(m=t.match(/ el (\d{1,2}) (?!hs |h |horas |y )/))){ const n=+m[1]; if(n>=1&&n<=31){ let d=new Date(hoy.getFullYear(),hoy.getMonth(),n); if(d<hoy) d.setMonth(d.getMonth()+1); e.fecha=iso(d); } }
  // hora
  let h=null, mi=0, tipo="exacta";
  if(m=norm(raw).match(/\b(\d{1,2})[:.](\d{2})\b/)){ h=+m[1]; mi=+m[2]; }
  else if(m=t.match(/ (a las|las|tipo|a eso de las|despues de las|desde las|antes de las|hasta las) (\d{1,2}|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce)( y media| y cuarto| y treinta| y quince)? /)){
    h=NUM_PAL[m[2]]||+m[2]; if(m[3]) mi=/media|treinta/.test(m[3])?30:15;
    if(/despues|desde/.test(m[1])) tipo="desde"; if(/antes|hasta/.test(m[1])) tipo="hasta"; }
  else if(m=t.match(/ (\d{1,2}) y (media|cuarto) /)){ h=+m[1]; mi=m[2]==="media"?30:15; }
  else if(m=t.match(/ (\d{1,2}) ?(hs|h|horas) /)) h=+m[1];
  if(h!=null&&h<24){
    if(h<12&&/ de la (tarde|noche) /.test(t)) h+=12;
    else if(h>=1&&h<=11&&!/ de la manana /.test(t)){
      const dd=e.fecha?desdeIso(e.fecha).getDay():null;
      const rangos=dd!=null&&f.horarios[dd]?[f.horarios[dd]]:Object.values(f.horarios).filter(Boolean);
      const dentro=x=>rangos.some(r=>x>=aMin(r.abre)&&x<aMin(r.cierra));
      if((e.franja&&e.franja[0]>=13*60)||(!dentro(h*60+mi)&&dentro((h+12)*60+mi))) h+=12;
    }
    const min=h*60+mi;
    if(tipo==="desde") e.franja=[min,24*60,"desde las "+aHora(min)]; else if(tipo==="hasta") e.franja=[0,min,"antes de las "+aHora(min)]; else e.hora=aHora(min);
  }
  // nombre y celular
  if(m=raw.match(/(?:me llamo|mi nombre es|a nombre de|soy)\s+([A-Za-zÁÉÍÓÚÑáéíóúñü]{2,}(?:\s+[A-Za-zÁÉÍÓÚÑáéíóúñü]{2,})?)/i)){
    const n=m[1].trim(); if(!/^(de|el|la|un|una|nuevo|nueva|cliente)\b/i.test(n)) e.nombre=cap(n.split(/\s+/).map(cap).join(" ")); }
  if(m=raw.match(/\+?\d[\d\s-]{6,}\d/)){ if(m[0].replace(/\D/g,"").length>=8) e.tel=m[0].trim(); }
  // qué quiere
  e.cancelarTurno=hay(" cancelar mi "," cancelar el turno "," cancelar la reserva "," no voy a poder "," no voy a ir "," no puedo ir "," cambiar mi turno "," cambiar el turno "," cambiar mi reserva "," cambiar la reserva ");
  e.confirmar=!e.cancelarTurno&&!hay(" no ")&&hay(" confirmo "," confirmar mi "," confirmar el turno "," confirmar la reserva "," confirmar asistencia "," si voy "," voy a ir "," ahi voy "," ahi estare "," alla estare ");
  e.cancelar=!e.cancelarTurno&&/^ (cancelar|cancela|cancelalo|dejalo|olvidalo|no gracias|nada) $/.test(t);
  e.turno=hay(" turno"," reserv"," agend"," cita "," sacar"," sacame"," anotame"," anotar"," lugar "," disponib"," tenes algo "," tienen algo "," hay algo "," hueco "," puedo ir "," me atienden "," voy ");
  e.ganas=hay(" quiero "," queria "," quisiera "," me gustaria "," necesito "," quiero hacerme "," vengo a ");
  if(hay(" precio"," cuanto sale"," cuanto cuesta"," cuanto esta"," sale "," cuesta "," vale "," valor "," tarifa"," cobran "," cuanto es ")) e.info="precio";
  else if(hay(" horario"," abren"," cierran"," abierto"," atienden "," que dias "," hasta que hora ")) e.info="horario";
  else if(hay(" donde "," direccion"," ubicacion"," como llego"," quedan "," estan ubicados ")) e.info="donde";
  else if(hay(" servicios "," que hacen "," que ofrecen "," que tienen ")) e.info="servicios";
  else if(hay(" hablar con "," una persona "," whatsapp "," telefono "," instagram "," el dueno "," la duena ")) e.info="contacto";
  else if(hay(" gracias "," genial "," perfecto "," barbaro "," buenisimo ")) e.info="gracias";
  else if(hay(" hola "," buenas "," buen dia "," que tal ")) e.info="hola";
  // preguntas frecuentes del local
  let fm=0; f.faqs.forEach(q=>{ const cl=palabras(q.p).filter(w=>sig(w)&&w.length>=4); const n=cl.filter(c=>toks.some(w=>w===c||(Math.min(w.length,c.length)>=5&&(w.startsWith(c)||c.startsWith(w))))).length; if(n>fm){fm=n;e.faq=q.r;} });
  return e;
}

/* --- lo que llega por la caja de texto --- */
function alRecibir(raw){
  const e=entender(raw), fl=flujo;
  const datos=e.servicioId||e.recursoId!==undefined||e.fecha||e.hora||e.franja||e.nombre||e.tel;
  // mini-flujo de cancelar / cambiar / confirmar un turno ya sacado
  if(fl&&fl.modo){
    if(e.cancelar) return cancelarFlujo();
    if(fl.espera==="tel-gestion"){
      if(e.tel) return buscarTurnos(e.tel);
      return preguntarG("Pasame el celular con el que sacaste "+elTurno()+" (solo los números).",[]);
    }
    bot(["Elegí una opción 👇"]); return setTimeout(fl.rerender,500);
  }
  if(fl&&fl.espera==="tel"&&e.tel){ fl.tel=e.tel; if(e.nombre) fl.nombre=e.nombre; return avanzar(); }
  if(fl&&fl.espera==="nombre"&&!datos&&!e.info&&!e.faq&&!e.cancelar&&!e.cancelarTurno){
    const n=raw.replace(/^(soy|me llamo|mi nombre es|a nombre de)\s+/i,"").trim();
    if(n.length<2||n.length>40) return bot(["¿Me pasás tu nombre?"]);
    fl.nombre=n.split(/\s+/).slice(0,3).map(cap).join(" "); return avanzar();
  }
  if(e.cancelarTurno) return iniciarGestion("cancelar",e.tel);
  if(e.confirmar&&!fl&&!(e.servicioId||e.fecha||e.hora||e.franja)) return iniciarGestion("confirmar",e.tel);
  if(e.cancelar&&fl) return cancelarFlujo();
  const esTurno=e.turno||e.fecha||e.hora||e.franja||(fl&&datos)||(e.servicioId&&e.ganas&&e.info!=="precio");
  if(esTurno&&!(e.info==="precio"&&!e.fecha&&!e.hora&&!e.turno)){
    flujo=fl||{}; const n=aplicar(e); return avanzar(n>=2);
  }
  if(e.info==="precio") return responderInfo("precio",e, fl?()=>setTimeout(avanzar,900):null);
  if(e.faq){ bot([esc(e.faq)]); return fl?setTimeout(avanzar,900):setTimeout(menuChips,650); }
  if(e.info) return responderInfo(e.info,e, fl?()=>setTimeout(avanzar,900):null);
  if(e.servicioId){ bot([infoServicio(e.servicioId)+"\n¿Te saco "+(palabra()==="reserva"?"una reserva":"un turno")+"?"]);
    return setTimeout(()=>chips([{texto:"Sí, dale",hacer:()=>{flujo={servicioId:e.servicioId};avanzar();}},{texto:"No, gracias",hacer:()=>responderInfo("gracias")}]),600); }
  if(fl){ bot(["No te entendí 🙈 Usá los botones, o escribime algo como “el viernes a las 5”."]); return setTimeout(avanzar,800); }
  sinDato();
}
function aplicar(e){
  let n=0; const fl=flujo;
  if(e.servicioId){fl.servicioId=e.servicioId;n++;}
  if(e.recursoId!==undefined){fl.recursoId=e.recursoId;n++;}
  if(e.fecha){ if(fl.fecha!==e.fecha&&!e.hora) fl.hora=null; fl.fecha=e.fecha;n++;}
  if(e.franja){fl.franja=e.franja; if(!e.hora) fl.hora=null; n++;}
  if(e.hora){fl.hora=e.hora;n++;}
  if(e.nombre){fl.nombre=e.nombre;n++;}
  if(e.tel){fl.tel=e.tel;n++;}
  return n;
}

function enFranja(h,fr){ const x=aMin(h); return !fr||(x>=fr[0]&&x<fr[1]); }
const nombreFranja=fr=>fr?" "+fr[2]:"";
function resumenFlujo(){
  const f=S.ficha, fl=flujo, p=[];
  if(fl.servicioId) p.push(f.servicios.find(s=>s.id===fl.servicioId).nombre);
  if(fl.recursoId) p.push("con "+f.recursos.find(r=>r.id===fl.recursoId).nombre);
  if(fl.fecha) p.push(etiquetaDia(fl.fecha)); if(fl.hora) p.push(fl.hora+" h"); else if(fl.franja) p.push(nombreFranja(fl.franja).trim());
  return p.join(" · ");
}
function avanzar(eco){
  const f=S.ficha, fl=flujo; if(!fl) return;
  const pre=eco?"Perfecto: "+esc(resumenFlujo())+".\n":"";
  if(fl.servicioId&&!f.servicios.some(s=>s.id===fl.servicioId)) fl.servicioId=null;
  if(!fl.servicioId){ fl.espera="servicio";
    return preguntar(pre+(fl.fecha||fl.hora?"Dale. ":"¡Dale! ")+"¿Qué te vas a hacer?",f.servicios.map(s=>({texto:s.nombre+" · "+precioTxt(s),hacer:()=>{fl.servicioId=s.id;avanzar();}}))); }
  const srv=f.servicios.find(s=>s.id===fl.servicioId);
  if(f.recursos.length<2&&fl.recursoId===undefined) fl.recursoId=f.recursos[0]?.id||null;
  if(fl.recursoId===undefined&&!fl.hora){ fl.espera="recurso";
    const lugar=["mesa","cancha","box","sala","consultorio"].includes(norm(f.recurso));
    return preguntar(pre+(lugar?"¿Tenés preferencia de "+esc(f.recurso)+"?":"¿Con quién te gustaría atenderte?"),
      f.recursos.map(r=>({texto:r.nombre,hacer:()=>{fl.recursoId=r.id;avanzar();}})).concat([{texto:"Me da igual",hacer:()=>{fl.recursoId=null;avanzar();}}])); }
  const rid=fl.recursoId||null;
  if(fl.fecha&&!diasAbiertos().includes(fl.fecha)){
    const d=desdeIso(fl.fecha), cerrado=!f.horarios[d.getDay()];
    bot([(cerrado?"El "+DIAS_L[d.getDay()].toLowerCase()+" no atendemos.":"Ese día todavía no se puede reservar (hasta "+f.anticipacion+" días adelante).")]);
    fl.fecha=null; fl.hora=null; return setTimeout(()=>avanzar(),700);
  }
  if(!fl.fecha){ fl.espera="fecha";
    const dias=diasAbiertos().filter(d=>libres(d,srv,rid).some(h=>enFranja(h.hora,fl.franja))).slice(0,8);
    if(!dias.length){ bot([pre+"Uf, no me quedan lugares"+nombreFranja(fl.franja)+" en los próximos días 😕"]); fl.franja=null; return setTimeout(()=>chips(contactoChips().concat([{texto:"Ver otros horarios",hacer:()=>avanzar()}])),600); }
    return preguntar(pre+"¿Qué día te viene bien?",dias.map(d=>({texto:etiquetaDia(d),hacer:()=>{fl.fecha=d;avanzar();}})));
  }
  const todos=libres(fl.fecha,srv,rid);
  if(fl.hora){
    if(!todos.some(h=>h.hora===fl.hora)){
      const pedida=aMin(fl.hora); fl.hora=null;
      const cerca=todos.slice().sort((a,b)=>Math.abs(aMin(a.hora)-pedida)-Math.abs(aMin(b.hora)-pedida)).slice(0,6).sort((a,b)=>aMin(a.hora)-aMin(b.hora));
      if(!cerca.length){ bot([pre+etiquetaDia(fl.fecha)+" ya no me queda nada."]); fl.fecha=null; return setTimeout(()=>avanzar(),700); }
      fl.espera="hora";
      return preguntar(pre+"A las "+aHora(pedida)+" no tengo libre"+(rid?" con "+esc(f.recursos.find(r=>r.id===rid).nombre):"")+". Lo más cerca que tengo "+etiquetaDia(fl.fecha).toLowerCase()+":",
        cerca.map(h=>({texto:h.hora,hacer:()=>{fl.hora=h.hora;avanzar();}})).concat([{texto:"Otro día",hacer:()=>{fl.fecha=null;fl.hora=null;avanzar();}}]));
    }
  }else{
    fl.espera="hora";
    let hs=todos.filter(h=>enFranja(h.hora,fl.franja)), aviso="";
    if(!hs.length&&todos.length){ aviso=esc(cap(nombreFranja(fl.franja).trim()))+" no me queda nada. "; hs=todos; }
    if(!hs.length){ bot([pre+etiquetaDia(fl.fecha)+" ya no me queda nada."]); fl.fecha=null; return setTimeout(()=>avanzar(),700); }
    return preguntar(pre+aviso+"Estos horarios están libres "+etiquetaDia(fl.fecha).toLowerCase()+":",
      hs.slice(0,14).map(h=>({texto:h.hora,hacer:()=>{fl.hora=h.hora;avanzar();}})).concat([{texto:"Otro día",hacer:()=>{fl.fecha=null;fl.hora=null;avanzar();}}]));
  }
  if(!fl.nombre){ fl.espera="nombre"; return bot([pre+"Buenísimo. ¿A nombre de quién lo anoto?"]); }
  if(!fl.tel){ fl.espera="tel"; return bot([pre+"Gracias, "+esc(fl.nombre)+". ¿Y un celular para el recordatorio?"]); }
  fl.espera="confirmar";
  if(pre) bot([pre.trim()]);
  mostrarPropuesta(fl,srv);
}

function filaTurno(t){

     "<label class='c'>Se puede reservar hasta<select id='cf-ant' data-k='anticipacion' data-num='1'>"+[3,7,14,21,30,60].map(n=>"<option value='"+n+"'"+(Number(b.anticipacion)===n?" selected":"")+">"+n+" días adelante</option>").join("")+"</select></label></div></section>";
  h+="<section class='bloque'><h3>6 · Preguntas frecuentes</h3><p class='sub'>Lo que siempre preguntan. El asistente contesta con esto y nunca inventa lo que no está.</p>"+
     b.faqs.map((q,i)=>"<div class='fila faq'><input id='cf-faq-p-"+i+"' data-l='faqs' data-i='"+i+"' data-f='p' value='"+esc(q.p)+"' placeholder='Pregunta' aria-label='Pregunta'>"+
       "<input id='cf-faq-r-"+i+"' class='r' data-l='faqs' data-i='"+i+"' data-f='r' value='"+esc(q.r)+"' placeholder='Respuesta' aria-label='Respuesta'>"+
       "<button type='button' class='quitar' data-quitar='faqs' data-i='"+i+"' aria-label='Quitar'>✕</button></div>").join("")+
     "<div><button class='btn' type='button' data-sumar='faqs'>+ Sumar pregunta</button></div></section>";
  h+="<section class='bloque'><h3>7 · Recordatorios y seña</h3><p class='sub'>Menos ausencias: avisás al cliente antes del "+esc(b.palabra)+" y, si querés, pedís una seña para dejarlo firme.</p>"+
     "<label class='check'><input type='checkbox' id='cf-confirma' data-k='pedirConfirmacion' data-bool='1'"+(b.pedirConfirmacion?" checked":"")+"> Pedir que el cliente confirme</label>"+
     "<div class='campos'><label class='c'>Recordar<select id='cf-rec-hs' data-k='recordatorioHoras' data-num='1'>"+[12,24,48].map(n=>"<option value='"+n+"'"+(Number(b.recordatorioHoras)===n?" selected":"")+">"+n+" hs antes</option>").join("")+"</select></label></div>"+
     "<label class='check'><input type='checkbox' id='cf-sena-activa' data-s='activa'"+(b.sena.activa?" checked":"")+"> Pedir seña para reservar</label>"+
     "<label class='check'><input type='checkbox' id='cf-sena-oblig' data-s='obligatoria'"+(b.sena.obligatoria?" checked":"")+"> Seña obligatoria (sin seña, no se reserva)</label>"+
     "<div class='campos'><label class='c'>Cómo se calcula<select id='cf-sena-tipo' data-s='tipo'><option value='fijo'"+(b.sena.tipo!=="porcentaje"?" selected":"")+">Monto fijo $</option><option value='porcentaje'"+(b.sena.tipo==="porcentaje"?" selected":"")+">Porcentaje del servicio %</option></select></label>"+
     "<label class='c'>"+(b.sena.tipo==="porcentaje"?"Porcentaje de la seña %":"Monto de la seña $")+"<input id='cf-sena-monto' class='num' type='number' min='0' "+(b.sena.tipo==="porcentaje"?"max='100' step='5'":"step='100'")+" data-s='monto' value='"+escA(b.sena.monto)+"'></label>"+
     "<label class='c'>Alias / CBU / usuario Mercado Pago<input id='cf-sena-alias' data-s='alias' value='"+escA(b.sena.alias)+"' autocomplete='off'></label>"+
     "<label class='c'>Nota de la seña (opcional)<input id='cf-sena-nota' data-s='nota' value='"+escA(b.sena.nota)+"' autocomplete='off'></label></div>"+
     "<p class='nota'>"+(b.sena.tipo==="porcentaje"?"La seña es ese % del precio de cada servicio (redondeado). ":"")+"Demo: el cliente ve el alias y avisa que transfirió; vos la marcás como recibida. En la versión real el cobro es automático por Mercado Pago.</p></section>";
  h+="<div class='pie-guardar'><button class='btn pri' type='button' data-act='guardar'>Guardar ficha</button><button class='btn' type='button' data-act='descartar'>Descartar cambios</button><span class='nota' id='cf-nota'></span></div>";
  hojaConfig.innerHTML=h;
}
const campo=(lab,k,v,tipo)=>"<label class='c'>"+lab+"<input id='cf-"+k+"' data-k='"+k+"' value='"+esc(v||"")+"'"+(tipo?" inputmode='"+tipo+"'":"")+" autocomplete='off'></label>";
hojaConfig.addEventListener("input",e=>{
  const el=e.target, b=S.borrador; if(!b) return;
  if(el.dataset.k){ b[el.dataset.k]= el.dataset.bool?el.checked : el.dataset.num?Number(el.value) : el.value; if(el.dataset.k==="color") aplicarMarca(b.color); }
  else if(el.dataset.s){ b.sena[el.dataset.s]= el.type==="checkbox"?el.checked : el.type==="number"?(el.value===""?"":Number(el.value)) : el.value;
    if(el.id==="cf-sena-tipo"){ pintarConfigConservando(); return marcarCambios(); } }
  else if(el.dataset.l){ const v=el.type==="number"?Number(el.value):el.value; b[el.dataset.l][Number(el.dataset.i)][el.dataset.f]=v; }
  else if(el.dataset.h){ const d=el.dataset.h;
    if(el.dataset.hf==="on"){ b.horarios[d]=el.checked?{abre:"10:00",cierra:"19:00"}:null; return pintarConfigConservando(); }
    if(b.horarios[d]) b.horarios[d][el.dataset.hf]=el.value; }
  document.getElementById("cf-nota").textContent="Hay cambios sin guardar"; document.getElementById("cf-nota").className="nota";
});
function pintarConfigConservando(){ const y=hojaConfig.scrollTop; pintarConfig(); hojaConfig.scrollTop=y; }
/* el logo se achica a 256px antes de guardarlo, para que no pese en la base */
function cargarLogo(file){
  return new Promise((res,rej)=>{ const fr=new FileReader();
    fr.onload=()=>{ const img=new Image(); img.onload=()=>{
      const max=256, s=Math.min(1,max/Math.max(img.width,img.height)), w=Math.round(img.width*s), h=Math.round(img.height*s);
      const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
      res(c.toDataURL("image/png")); }; img.onerror=rej; img.src=fr.result; };
    fr.onerror=rej; fr.readAsDataURL(file); });
}
hojaConfig.addEventListener("change",async e=>{
  if(e.target.id!=="cf-logo"||!S.borrador) return;
  const file=e.target.files&&e.target.files[0]; if(!file) return;
  try{ S.borrador.logo=await cargarLogo(file); }catch(err){ return; }
  pintarConfigConservando(); marcarCambios();
});
hojaConfig.addEventListener("click",async e=>{
  const el=e.target.closest("button"); if(!el) return; const b=S.borrador;
  if(el.dataset.act==="quitar-logo"){ b.logo=""; pintarConfigConservando(); return marcarCambios(); }
  if(el.dataset.rubro){ S.cambiarRubro=el.dataset.rubro; return pintarConfigConservando(); }
  if(el.dataset.act==="rubro-si"){ S.borrador=armarFicha(S.cambiarRubro); S.cambiarRubro=null; aplicarMarca(S.borrador.color); pintarConfigConservando(); return marcarCambios(); }
  if(el.dataset.act==="rubro-no"){ S.cambiarRubro=null; return pintarConfigConservando(); }
  if(el.dataset.sumar){ const l=el.dataset.sumar;
    b[l].push(l==="servicios"?{id:"",nombre:"",precio:0,duracion:30,alias:""}:l==="faqs"?{p:"",r:""}:{id:"",nombre:""}); pintarConfigConservando(); return marcarCambios(); }
  if(el.dataset.quitar){ const l=el.dataset.quitar; if((l==="servicios"||l==="recursos")&&b[l].length<2) return; b[l].splice(Number(el.dataset.i),1); pintarConfigConservando(); return marcarCambios(); }
  if(el.dataset.act==="descartar"){ S.borrador=null; aplicarMarca(S.ficha.color); return pintarConfig(); }
  if(el.dataset.act==="guardar"){
    const nota=document.getElementById("cf-nota");
    const f=limpio(b);
    f.recursos=f.recursos.filter(r=>r.nombre.trim()); f.servicios=f.servicios.filter(s=>s.nombre.trim()); f.faqs=f.faqs.filter(q=>q.p.trim()&&q.r.trim());
    if(!f.nombre.trim()||!f.recursos.length||!f.servicios.length){ nota.textContent="Faltan el nombre, al menos un "+f.recurso+" y al menos un servicio."; nota.className="nota mal"; return; }
    if(!Object.values(f.horarios).some(Boolean)){ nota.textContent="Marcá al menos un día abierto."; nota.className="nota mal"; return; }
    const sn=senaDe(f), pct=sn.tipo==="porcentaje", monto=Number(sn.monto);
    if(!isFinite(monto)||monto<0){ nota.textContent="La seña tiene que ser un número, de 0 para arriba."; nota.className="nota mal"; return; }
    if(pct&&monto>100){ nota.textContent="El porcentaje de la seña no puede pasar de 100."; nota.className="nota mal"; return; }
    if(sn.activa&&monto>0&&!String(sn.alias).trim()){ nota.textContent="Cargá el alias o usuario donde recibís la seña."; nota.className="nota mal"; return; }
    f.sena={activa:!!sn.activa,obligatoria:!!sn.obligatoria,tipo:pct?"porcentaje":"fijo",monto:Math.round(monto),alias:String(sn.alias).trim(),nota:String(sn.nota).trim()};
    f.recordatorioHoras=Number(f.recordatorioHoras)||24; f.pedirConfirmacion=f.pedirConfirmacion!==false;
    // los ids se conservan si ya existían; los nuevos salen del nombre
    const usados=new Set();
    [f.recursos,f.servicios].forEach(lista=>{ usados.clear(); lista.forEach(x=>{ let id=x.id||slug(x.nombre),k=id,i=2; while(usados.has(k)) k=id+"-"+(i++); x.id=k; usados.add(k); }); });
    f.servicios.forEach(s=>{ s.precio=Math.max(0,Number(s.precio)||0); s.duracion=Math.max(5,Number(s.duracion)||30); });
    f.ejemplo=false;
    try{ await guardarFicha(f); S.borrador=null; pintarConfig(); const n=document.getElementById("cf-nota"); n.textContent="Guardado. El chat ya responde con esta ficha."; n.className="nota ok"; }
    catch(err){ nota.textContent="No se pudo guardar: solo quien administra esta página puede cambiar la ficha."; nota.className="nota mal"; }
  }
});
function marcarCambios(){ const n=document.getElementById("cf-nota"); if(n){ n.textContent="Hay cambios sin guardar"; n.className="nota"; } }

/* =====================================================================
   MARCA, CARAS Y ARRANQUE
   ===================================================================== */
function aplicarMarca(color){
  const c=/^#[0-9a-f]{6}$/i.test(color||"")?color:"#A86D21";
  const r=parseInt(c.slice(1,3),16)/255,g=parseInt(c.slice(3,5),16)/255,b=parseInt(c.slice(5,7),16)/255;
  const L=x=>x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4); const lum=.2126*L(r)+.7152*L(g)+.0722*L(b);
  const root=document.documentElement.style; root.setProperty("--brand",c); root.setProperty("--brand-ink",lum>.42?"#1B1915":"#FFFFFF");
}
let fichaClave="";
function pintarTodo(desdeBase){
  const f=S.ficha;
  aplicarMarca(S.borrador?S.borrador.color:f.color);
  document.getElementById("nomChat").textContent=f.nombre;
  const av=document.getElementById("avatar");
  if(f.logo){ av.innerHTML="<img src='"+esc(f.logo)+"' alt='"+esc(f.nombre)+"'>"; }
  else{ av.textContent=(f.nombre.replace(/^(barber[ií]a|estudio|taller|bodeg[oó]n|nail bar|p[aá]del club)\s+/i,"").trim()[0]||"·").toUpperCase(); }
  document.getElementById("cintaChat").textContent=f.ejemplo?"Demostración · "+f.rubro+" de ejemplo":"Demostración";
  pintarEstadoChat();
  const clave=JSON.stringify(f);
  if(clave!==fichaClave){ const antes=fichaClave; fichaClave=clave; if(!antes||!flujo) saludo(); }
  if(S.cara==="local") pintarLocal();
  if(S.cara==="configurar" && !S.borrador) pintarConfig();
}
const LEYENDAS={cliente:"Lo que ve quien escanea el QR: pregunta y saca turno solo.",
  local:"Lo que ve el local en su celular: la agenda, quién vino y la caja del día.",
  configurar:"El alta: los datos del local. Lo cargás vos en la visita, en 5 minutos."};
function irA(cara){
  S.cara=cara;
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-selected",b.dataset.cara===cara));
  ["cliente","local","configurar"].forEach(c=>document.getElementById("v-"+c).hidden=c!==cara);
  document.getElementById("marco").classList.toggle("chat",cara==="cliente");
  document.getElementById("leyenda").textContent=LEYENDAS[cara];
  if(cara==="local"){ pintarLocal(); }
  if(cara==="configurar"){ pintarConfig(); }
  if(cara!=="configurar" && S.borrador){ /* cambios sin guardar quedan en el borrador */ aplicarMarca(S.ficha.color); }
  if(cara==="configurar" && S.borrador) aplicarMarca(S.borrador.color);
}
document.querySelectorAll(".seg button").forEach(b=>b.addEventListener("click",()=>irA(b.dataset.cara)));
const h0=location.hash.replace("#",""); if(["cliente","local","configurar"].includes(h0)) irA(h0);
iniciarDatos();
</script>
